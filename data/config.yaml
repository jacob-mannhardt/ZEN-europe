# global settings
name: crystal_ball
source_path: "./data/raw_data"
output_folder: null

# all settings in the system.json file with the exception of technology lists
system:
  set_nodes:
    - AT
    - BE
    - BG
    - CH
    - CZ
    - DE
    - DK
    - EE
    - EL
    - ES
    - FI
    - FR
    - HR
    - HU
    - IE
    - IT
    - LT
    - LU
    - LV
    - NL
    - "NO"
    - PL
    - PT
    - RO
    - SE
    - SI
    - SK
    - UK
  set_transport_technologies_loss_exponential: null
  use_existing_capacities: null
  allow_investment: null
  double_capex_transport: null
  unaggregated_time_steps_per_year: null
  conduct_time_series_aggregation: true
  aggregated_time_steps_per_year: 10
  reference_year: 2022
  total_hours_per_year: null
  optimized_years: 15
  interval_between_years: 2
  use_rolling_horizon: false
  years_in_rolling_horizon: null
  years_in_decision_horizon: null
  conduct_scenario_analysis: null
  run_default_scenario: null
  clean_sub_scenarios: null
  storage_periodicity: null
  multiyear_periodicity: null
  exclude_parameters_from_TSA: null
  knowledge_depreciation_rate: null
  storage_charge_discharge_binary: null

# TODO: remove redundancy
# dataset-specific, type-checked settings (see zen_europe/settings/).
# categories/fields not listed here keep their class defaults.
settings:
  time:
    reference_year: 2022
    interval_between_years: 2

# add and remove technologies/carriers from the model
elements:
  insert:
    energy_system: "energy_system_nuts0"
    set_sectors:
      - electricity
      - carbon
      - gas
      - heat
      - district_heating
      - hydrogen
      - ammonia
      - cement
      - methanol
      - refining
      - aviation
      - shipping
      - steel
      - passenger_transport
      - truck_transport
    set_conversion_technologies: []
    set_retrofitting_technologies: []
    set_storage_technologies: []
    set_transport_technologies: []
    # extra individual elements not covered by a sector can still be listed here
    set_carriers: []
  exclude:
    energy_system: ""
    set_sectors: []
    set_conversion_technologies: []
    set_storage_technologies: []
    set_transport_technologies: []
    set_retrofitting_technologies: []
    set_carriers: []

# # settings for individual data sources
# TODO commented out because results in error and unclear to me
# data:
#   datasets:
#     setting: true
#   dataset_collections:
#     setting: true

# settings that go into the energy_system folder
energy_system:
  units:
    base_units:
      - hour
      - GW
      - km
      - megatons
      - megaEuro
      - kilotCO2
      - megavkm
      - megatkm
      - ktproduct
    definitions:
      Euro:
        dimension: currency
        aliases:
          - EURO
          - Eur
      tCO2:
        dimension: massCO2
        aliases:
          - tonCO2
          - tonne_carbon
      vkm:
        dimension: mileage
        aliases:
          - vehicle_km
          - vehicle_kilometer
      tkm:
        dimension: tonne_mileage
        aliases:
          - tonne_km
          - tonne_kilometer
      tproduct:
        dimension: mass_product
        aliases:
          - tonproduct
          - tonne_product
  parameters_interpolation_off:
    parameter_name:
      - carbon_emissions_annual_limit
